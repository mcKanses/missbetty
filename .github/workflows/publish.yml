name: Publish

on:
  push:
    branches: [main]
  # Publishes an already released version to npm by hand, e.g. one released
  # while npm publishing was paused. semantic-release never republishes a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm, e.g. v1.7.4
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  # npm trusted publishing: the job proves its identity to npm with an OIDC
  # token, so no long-lived NPM_TOKEN secret is needed.
  id-token: write

jobs:
  semantic-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Optional token for the release metadata PR. PRs opened with GITHUB_TOKEN
      # do not trigger other workflows, so the required CI check never runs on
      # them; with this token set, CI runs and the PR merges itself.
      HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        run: npm run lint:md

      - name: Test
        run: npm test

      # @semantic-release/npm verifies the OIDC trusted-publisher setup in its
      # verifyConditions step, before anything is tagged or published.
      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable hooks for release metadata commit
        run: git config core.hooksPath /dev/null

      - name: Update README install version
        run: |
          TAG=$(node -p "require('./package.json').version")
          sed -i "s/BETTY_VERSION=v[0-9]\+\.[0-9]\+\.[0-9]\+/BETTY_VERSION=v${TAG}/g" README.md
          sed -i "s/\$env:BETTY_VERSION = 'v[0-9]\+\.[0-9]\+\.[0-9]\+'/\$env:BETTY_VERSION = 'v${TAG}'/g" README.md

      - name: Create release metadata PR
        id: metadata-pr
        uses: peter-evans/create-pull-request@v6
        env:
          HUSKY: 0
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: development
          branch: chore/release-metadata
          delete-branch: true
          title: "chore: Sync release metadata"
          commit-message: "chore: Sync release metadata"
          body: |
            Sync package metadata and changelog generated by semantic-release.
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
            README.md

      - name: Auto-merge release metadata PR
        if: env.HAS_RELEASE_PR_TOKEN == 'true' && steps.metadata-pr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.metadata-pr.outputs.pull-request-number }}" --auto --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}

  npm-publish-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "Expected a release tag like v1.7.4, got: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # semantic-release sets the version only in its own checkout; the tagged
      # commit still carries the previous one.
      - name: Set version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
