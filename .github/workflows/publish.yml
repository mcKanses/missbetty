name: Publish

on:
  push:
    branches: [main]
  # Publishes an already released version to npm by hand, e.g. to retry after
  # an npm failure. semantic-release never republishes a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm, e.g. v1.7.4
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  # npm trusted publishing: the job proves its identity to npm with an OIDC
  # token, so no long-lived NPM_TOKEN secret is needed.
  id-token: write

jobs:
  semantic-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Optional token for the release metadata PR. PRs opened with GITHUB_TOKEN
      # do not trigger other workflows, so the required CI check never runs on
      # them; with this token set, CI runs and the PR merges itself.
      HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        run: npm run lint:md

      - name: Test
        run: npm test

      # Tags, writes the changelog and creates the GitHub release. npm publishing
      # happens in the npm-publish job below.
      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable hooks for release metadata commit
        run: git config core.hooksPath /dev/null

      - name: Update README install version
        run: |
          TAG=$(node -p "require('./package.json').version")
          sed -i "s/BETTY_VERSION=v[0-9]\+\.[0-9]\+\.[0-9]\+/BETTY_VERSION=v${TAG}/g" README.md
          sed -i "s/\$env:BETTY_VERSION = 'v[0-9]\+\.[0-9]\+\.[0-9]\+'/\$env:BETTY_VERSION = 'v${TAG}'/g" README.md

      - name: Create release metadata PR
        id: metadata-pr
        uses: peter-evans/create-pull-request@v6
        env:
          HUSKY: 0
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: development
          branch: chore/release-metadata
          delete-branch: true
          title: "chore: Sync release metadata"
          commit-message: "chore: Sync release metadata"
          body: |
            Sync package metadata and changelog generated by semantic-release.
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
            README.md

      - name: Auto-merge release metadata PR
        if: env.HAS_RELEASE_PR_TOKEN == 'true' && steps.metadata-pr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.metadata-pr.outputs.pull-request-number }}" --auto --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}

  # npm publishing is its own job, after the release: an npm problem (registry
  # outage, trusted-publisher setting) then cannot block the tag, the GitHub
  # release or the binaries, and it can be retried per tag by hand. On a push
  # it publishes the tag semantic-release just created; started by hand it
  # publishes the given tag. Versions already on npm are skipped, so reruns are
  # safe.
  npm-publish:
    needs: semantic-release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.semantic-release.result == 'success')
    # An automatic run reports an npm failure on this job without turning the
    # whole Publish run red, which would stop release-binaries.
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # This job runs third-party install scripts (npm ci) and tests; it needs to
    # read the repo and get an OIDC token for npm, nothing more.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1 || true)
            if [ -z "$TAG" ]; then
              echo "No release was cut for this commit; nothing to publish."
              exit 0
            fi
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "Expected a release tag like v1.7.4, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          if npm view "missbetty@$VERSION" version >/dev/null 2>&1; then
            echo "missbetty@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # No registry-url here: with it, setup-node writes an .npmrc whose token
      # defaults to a placeholder, and npm sends that instead of using the OIDC
      # trusted-publishing login (the registry then answers 404).
      - name: Setup Node.js
        if: steps.tag.outputs.version != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        if: steps.tag.outputs.version != ''
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.tag.outputs.version != ''
        run: npm ci

      - name: Build
        if: steps.tag.outputs.version != ''
        run: npm run build

      - name: Test
        if: steps.tag.outputs.version != ''
        run: npm test

      # semantic-release bumps the version only in its own checkout; the tagged
      # commit still carries the previous one.
      - name: Set version from tag
        if: steps.tag.outputs.version != ''
        run: npm version "${{ steps.tag.outputs.version }}" --no-git-tag-version --allow-same-version --ignore-scripts

      # The build above is what gets published; skip prepack's second build.
      - name: Publish to npm
        if: steps.tag.outputs.version != ''
        run: npm publish --access public --ignore-scripts
