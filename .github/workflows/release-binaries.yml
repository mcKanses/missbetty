name: Release Binaries

# Builds the platform binaries that install.sh / install.ps1 download, from the
# release tag, into the release semantic-release created as a draft. The draft
# is published (and becomes "Latest") only once every binary is uploaded, so
# installers never see a release without its assets.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  # Rebuild a release by hand, e.g. after a failed build left it a draft. Only
  # runs from main may sign: the installers accept no other signer.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build binaries for, e.g. v1.7.4
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    # Only Publish runs from a push to main can cut a release; a hand-started
    # Publish run (npm-only) never does.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'cancelled')
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - name: Resolve tag and release
        id: resolve
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tagPattern = /^v\d+\.\d+\.\d+$/
            let tag = ''
            if (context.eventName === 'workflow_dispatch') {
              tag = process.env.INPUT_TAG
              if (!tagPattern.test(tag)) return core.setFailed(`Expected a release tag like v1.7.4, got: ${tag}`)
            } else {
              // A release exists only if semantic-release tagged the commit this
              // Publish run was for. Without that, there is nothing to build,
              // and the latest release's assets must stay untouched.
              const sha = context.payload.workflow_run.head_sha
              const tags = await github.paginate(github.rest.repos.listTags, { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 })
              tag = tags.find((t) => t.commit.sha === sha && tagPattern.test(t.name))?.name ?? ''
              if (tag === '') {
                core.notice(`No release tag on ${sha}; nothing to build.`)
                return core.setOutput('tag_name', '')
              }
            }

            // Drafts are not returned by the by-tag endpoint, so search the list.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 })
            const release = releases.find((r) => r.tag_name === tag)
            if (release === undefined) return core.setFailed(`No GitHub release exists for ${tag}.`)

            core.setOutput('tag_name', tag)
            core.setOutput('draft', String(release.draft))

  build-and-upload:
    needs: resolve-release
    if: needs.resolve-release.outputs.tag_name != ''
    name: Build Binary (${{ matrix.asset_name }})
    runs-on: ${{ matrix.runs_on }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            asset_name: betty-linux-x64.tar.gz
            binary_name: betty
            archive_kind: tar
          - runs_on: ubuntu-24.04-arm
            asset_name: betty-linux-arm64.tar.gz
            binary_name: betty
            archive_kind: tar
          - runs_on: macos-latest
            asset_name: betty-darwin-x64.tar.gz
            binary_name: betty
            archive_kind: tar
            target_node_dist: darwin-x64
            target_node_binary: bin/node
          - runs_on: macos-latest
            asset_name: betty-darwin-arm64.tar.gz
            binary_name: betty
            archive_kind: tar
          - runs_on: windows-latest
            asset_name: betty-windows-x64.zip
            binary_name: betty.exe
            archive_kind: zip
          - runs_on: windows-latest
            asset_name: betty-windows-arm64.zip
            binary_name: betty.exe
            archive_kind: zip
            target_node_dist: win-arm64
            target_node_binary: node.exe

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set binary version from release tag
        shell: bash
        env:
          TAG: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\\n');" "${TAG#v}"

      # Cross-built targets embed a Node runtime downloaded from nodejs.org; it is
      # checked against the release's SHASUMS256.txt before it gets signed into
      # Betty's binary.
      - name: Prepare target Node runtime (tar)
        if: matrix.target_node_dist != '' && matrix.archive_kind == 'tar'
        shell: bash
        run: |
          NODE_VERSION="$(node -p 'process.version.slice(1)')"
          ARCHIVE="node-v${NODE_VERSION}-${{ matrix.target_node_dist }}.tar.gz"
          BASE="https://nodejs.org/dist/v${NODE_VERSION}"

          mkdir -p .node-runtime
          curl -fsSL "$BASE/$ARCHIVE" -o ".node-runtime/$ARCHIVE"
          curl -fsSL "$BASE/SHASUMS256.txt" -o .node-runtime/SHASUMS256.txt
          (cd .node-runtime && grep " $ARCHIVE\$" SHASUMS256.txt | shasum -a 256 -c -)
          tar -xzf ".node-runtime/$ARCHIVE" -C .node-runtime --strip-components=1
          echo "BETTY_SEA_NODE_BINARY=$PWD/.node-runtime/${{ matrix.target_node_binary }}" >> "$GITHUB_ENV"

      - name: Prepare target Node runtime (zip)
        if: matrix.target_node_dist != '' && matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          $nodeVersion = node -p "process.version.slice(1)"
          $archive = "node-v$nodeVersion-${{ matrix.target_node_dist }}.zip"
          $base = "https://nodejs.org/dist/v$nodeVersion"

          New-Item -ItemType Directory -Force -Path .node-runtime | Out-Null
          Invoke-WebRequest -Uri "$base/$archive" -OutFile .node-runtime\node.zip
          Invoke-WebRequest -Uri "$base/SHASUMS256.txt" -OutFile .node-runtime\SHASUMS256.txt
          $line = Select-String -Path .node-runtime\SHASUMS256.txt -Pattern "  $([regex]::Escape($archive))$" | Select-Object -First 1
          if (-not $line) { throw "No checksum for $archive in SHASUMS256.txt" }
          $expected = ($line.Line -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 .node-runtime\node.zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "Checksum mismatch for ${archive}: expected $expected, got $actual" }

          Expand-Archive -Path .node-runtime\node.zip -DestinationPath .node-runtime\expanded -Force
          $root = Get-ChildItem -Path .node-runtime\expanded | Select-Object -First 1
          $targetNode = Join-Path $root.FullName '${{ matrix.target_node_binary }}'
          "BETTY_SEA_NODE_BINARY=$targetNode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build standalone binary
        run: npm run binary

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Package binary (tar)
        if: matrix.archive_kind == 'tar'
        shell: bash
        run: |
          mkdir -p release
          cp "dist/${{ matrix.binary_name }}" release/
          tar -C release -czf "${{ matrix.asset_name }}" "${{ matrix.binary_name }}"

      - name: Create checksum (tar)
        if: matrix.archive_kind == 'tar'
        shell: bash
        run: |
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Sign assets (tar)
        if: matrix.archive_kind == 'tar'
        shell: bash
        run: |
          cosign sign-blob --yes --output-signature "${{ matrix.asset_name }}.sig" --output-certificate "${{ matrix.asset_name }}.pem" "${{ matrix.asset_name }}"
          cosign sign-blob --yes --output-signature "${{ matrix.asset_name }}.sha256.sig" --output-certificate "${{ matrix.asset_name }}.sha256.pem" "${{ matrix.asset_name }}.sha256"

      - name: Package binary (zip)
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/${{ matrix.binary_name }}" "release/${{ matrix.binary_name }}"
          Compress-Archive -Path "release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Create checksum (zip)
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}").Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii

      - name: Sign assets (zip)
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          cosign sign-blob --yes --output-signature "${{ matrix.asset_name }}.sig" --output-certificate "${{ matrix.asset_name }}.pem" "${{ matrix.asset_name }}"
          cosign sign-blob --yes --output-signature "${{ matrix.asset_name }}.sha256.sig" --output-certificate "${{ matrix.asset_name }}.sha256.pem" "${{ matrix.asset_name }}.sha256"

      # gh also finds draft releases by tag. --clobber lets a rerun replace the
      # assets of the same tag, which were built from the same tagged commit.
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag_name }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ASSET" "$ASSET.sha256" "$ASSET.sig" "$ASSET.pem" "$ASSET.sha256.sig" "$ASSET.sha256.pem"

  # Publishes the draft only when every binary was uploaded. If a build failed,
  # the release stays a draft and installers keep serving the previous one.
  publish-release:
    needs: [resolve-release, build-and-upload]
    if: needs.resolve-release.outputs.draft == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag_name }}
        # A rebuilt older release must not become "Latest": the installers'
        # default download would then go back a version. GitHub makes a newly
        # published release Latest unless told otherwise.
        run: |
          newest="$( { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName'; echo "$TAG"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

  # Installs the published release the way users do.
  # Covers every binary, including the two cross-built ones (macOS Intel,
  # Windows arm64), on a runner of their own architecture.
  smoke-test:
    needs: [resolve-release, build-and-upload, publish-release]
    if: always() && needs.resolve-release.outputs.tag_name != '' && needs.build-and-upload.result == 'success' && (needs.publish-release.result == 'success' || needs.publish-release.result == 'skipped')
    name: Smoke Test (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        runs_on: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      # The installers users run come from main, not from the release tag, so
      # test those against the release (an old tag's installer may be outdated).
      - name: Checkout the current installers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        env:
          BETTY_VERSION: ${{ needs.resolve-release.outputs.tag_name }}
          BETTY_SKIP_DEPS: 'true'
        run: |
          export BETTY_INSTALL_DIR="$RUNNER_TEMP/betty-bin"
          mkdir -p "$BETTY_INSTALL_DIR"
          for attempt in 1 2 3 4 5; do
            if sh ./install.sh; then break; fi
            if [ "$attempt" = "5" ]; then echo "Installer smoke test failed after retries."; exit 1; fi
            echo "Retrying installer smoke test ($attempt/5)..."
            sleep 5
          done
          "$BETTY_INSTALL_DIR/betty" --help > /dev/null

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BETTY_VERSION: ${{ needs.resolve-release.outputs.tag_name }}
          BETTY_SKIP_DEPS: 'true'
        run: |
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-bin'
          New-Item -ItemType Directory -Force -Path $env:BETTY_INSTALL_DIR | Out-Null
          # A child pwsh reports failure through its exit code, not an exception.
          for ($i = 1; $i -le 5; $i++) {
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw 'Installer smoke test failed after retries.' }
            Write-Host "Retrying installer smoke test ($i/5)..."
            Start-Sleep -Seconds 5
          }
          & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'betty --help failed.' }
