name: Test installers

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'uninstall.ps1'
      - '.github/workflows/test-install.yml'
  push:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'uninstall.ps1'
      - '.github/workflows/test-install.yml'

permissions:
  contents: read

jobs:
  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel runs the cross-built Intel binary.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Piped the way the README shows. The variables go to `sh`, after sudo,
      # so they reach the script.
      - name: Install a pinned version without dependencies
        run: |
          curl -fsSL "file://$PWD/install.sh" | sudo BETTY_SKIP_DEPS=true BETTY_VERSION=v1.7.4 sh
          betty --version | grep -q '1.7.4'
          # A root install must leave the binary owned by root: the archive
          # stores the build user, which is this runner's own uid here, so
          # only the owner check shows the difference.
          owner="$(stat -c %u /usr/local/bin/betty 2>/dev/null || stat -f %u /usr/local/bin/betty)"
          [ "$owner" = "0" ] || { echo "/usr/local/bin/betty is owned by uid $owner, not root"; exit 1; }

      # What `betty update` does for a user whose betty is in /usr/local/bin:
      # the installer runs unprivileged and falls back to sudo for the write.
      - name: Update a root-owned install as a regular user
        run: |
          BETTY_SKIP_DEPS=true BETTY_SKIP_PATH=true BETTY_VERSION=v1.7.5 BETTY_INSTALL_DIR=/usr/local/bin sh install.sh
          betty --version | grep -q '1.7.5'
          # Homebrew on Intel macOS hands /usr/local/bin to the user; there the
          # installer writes without sudo and the binary is the user's.
          if [ -w /usr/local/bin ]; then echo "/usr/local/bin is writable; no sudo fallback here"; exit 0; fi
          owner="$(stat -c %u /usr/local/bin/betty 2>/dev/null || stat -f %u /usr/local/bin/betty)"
          [ "$owner" = "0" ] || { echo "/usr/local/bin/betty is owned by uid $owner, not root"; exit 1; }

      # A custom directory in the user's home must stay owned by the user, not
      # by root after a sudo fallback.
      - name: Install into a new directory in the user's home
        run: |
          curl -fsSL "file://$PWD/install.sh" | BETTY_SKIP_DEPS=true BETTY_VERSION=v1.7.4 BETTY_INSTALL_DIR="$HOME/betty-bin" sh
          [ -O "$HOME/betty-bin" ] && [ -O "$HOME/betty-bin/betty" ]
          "$HOME/betty-bin/betty" --version | grep -q '1.7.4'

      - name: Refuse to install without cosign when a signature is required
        run: |
          if command -v cosign >/dev/null 2>&1; then echo "cosign is preinstalled; skipping"; exit 0; fi
          if curl -fsSL "file://$PWD/install.sh" | sudo BETTY_SKIP_DEPS=true BETTY_REQUIRE_SIGNATURE=true BETTY_VERSION=v1.7.5 sh; then
            echo "The installer should have refused to install without cosign."
            exit 1
          fi

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # cosign-installer puts cosign in a user directory, which sudo's PATH drops.
      - name: Install with a verified signature
        run: |
          curl -fsSL "file://$PWD/install.sh" | sudo env "PATH=$PATH" BETTY_SKIP_DEPS=true BETTY_REQUIRE_SIGNATURE=true BETTY_VERSION=v1.7.5 sh | tee install.log
          grep -q 'Signature verification passed' install.log
          betty --version | grep -q '1.7.5'

  # The arm64 binary is cross-built on x64; this runs it on arm64 Windows.
  install-ps1-arm64:
    name: install.ps1 (windows arm64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install a pinned version without dependencies
        shell: pwsh
        run: |
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-bin'
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
          $version = & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --version
          if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch '1\.7\.5') { throw "unexpected betty --version output: $version" }

  install-ps1:
    name: install.ps1 (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Run through `iex` like `irm … | iex`, where there is no script file (the
      # old elevation relaunch via $PSCommandPath broke exactly there). GitHub's
      # Windows runners are elevated, so this cannot prove the non-admin path.
      - name: Install a pinned version without dependencies
        shell: pwsh
        run: |
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_VERSION = 'v1.7.4'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-bin'
          $script = Get-Content -Raw ./install.ps1
          $runner = "Invoke-Expression ([System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('$([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($script)))')))"
          $p = Start-Process pwsh -ArgumentList '-NoProfile', '-Command', $runner -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "install.ps1 failed with exit code $($p.ExitCode)" }
          $version = & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --version
          if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch '1\.7\.4') { throw "unexpected betty --version output: $version" }

      - name: Refuse to install without cosign when a signature is required
        shell: pwsh
        run: |
          if (Get-Command cosign -ErrorAction SilentlyContinue) { Write-Host 'cosign is preinstalled; skipping'; exit 0 }
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_REQUIRE_SIGNATURE = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-refused'
          $p = Start-Process pwsh -ArgumentList '-NoProfile', '-File', './install.ps1' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -eq 0) { throw 'The installer should have refused to install without cosign.' }

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Windows PowerShell 5.1, the shell `irm … | iex` usually runs in: it treats
      # stderr from cosign differently from pwsh. The step runs in 5.1 itself;
      # launched from pwsh, 5.1 would inherit pwsh's module path and miss cmdlets.
      - name: Install with a verified signature (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_REQUIRE_SIGNATURE = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-signed'
          # The runner sets 'Stop'; the child's own output must not abort this step.
          $ErrorActionPreference = 'Continue'
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) { throw "install.ps1 failed with exit code $exitCode" }
          if ($output -notmatch 'Signature verification passed') { throw 'The signature was not verified.' }
          $version = & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --version
          if (($version -join ' ') -notmatch '1\.7\.5') { throw "unexpected betty --version output: $version" }

      # The dependency path, with stand-ins for docker and mkcert that succeed.
      # It used to wait for the full timeout even with Docker running, because
      # `if (docker info ...)` tested the output instead of the exit code.
      - name: Install with dependencies present (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $stubs = Join-Path $env:RUNNER_TEMP 'stubs'
          New-Item -ItemType Directory -Path $stubs -Force | Out-Null
          Set-Content -Path (Join-Path $stubs 'docker.cmd') -Value '@exit /b 0'
          Set-Content -Path (Join-Path $stubs 'mkcert.cmd') -Value '@exit /b 0'
          $env:Path = "$stubs;$env:Path"
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-deps'
          $env:BETTY_DOCKER_WAIT_SECONDS = '30'
          $ErrorActionPreference = 'Continue'
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) { throw "install.ps1 failed with exit code $exitCode" }
          if ($output -notmatch 'Docker daemon is running') { throw 'The running Docker daemon was not detected.' }
          if ($output -notmatch 'mkcert CA installed') { throw 'mkcert -install was not reported as successful.' }

      # What `betty update` does on Windows: replace a betty.exe that is
      # running. Windows PowerShell 5.1, like the update.
      - name: Replace a running betty.exe (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'betty-running'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # Any long-running exe named betty.exe holds the file open like betty.
          Copy-Item "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" (Join-Path $dir 'betty.exe')
          $running = Start-Process (Join-Path $dir 'betty.exe') -ArgumentList '-NoProfile', '-Command', 'Start-Sleep 120' -PassThru -WindowStyle Hidden
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_SKIP_PATH = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = $dir
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
          $version = & (Join-Path $dir 'betty.exe') --version
          if (($version -join ' ') -notmatch '1\.7\.5') { throw "betty.exe was not replaced: $version" }
          if (Test-Path (Join-Path $dir 'betty.exe.new')) { throw 'The staged copy was left behind.' }
          Stop-Process -Id $running.Id -Force

      # Through `iex` like the README: the session must survive when betty is
      # already gone, and the PATH entry must still be removed.
      - name: Uninstall through iex without closing the session
        shell: pwsh
        run: |
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-gone'
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $before = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.SetValue('Path', "$before;$env:BETTY_INSTALL_DIR", [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $script = Get-Content -Raw ./uninstall.ps1
          $runner = "Invoke-Expression ([System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('$([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($script)))'))); Write-Output 'session-alive'"
          $output = pwsh -NoProfile -Command $runner | Out-String
          Write-Host $output
          if ($output -notmatch 'session-alive') { throw 'uninstall.ps1 ended the session.' }
          $after = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Close()
          if ($after -match [regex]::Escape($env:BETTY_INSTALL_DIR)) { throw 'The PATH entry was not removed.' }
