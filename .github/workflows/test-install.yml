name: Test installers

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/test-install.yml'
  push:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/test-install.yml'

permissions:
  contents: read

jobs:
  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel runs the cross-built Intel binary.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Piped the way the README shows. The variables go to `sh`, after sudo,
      # so they reach the script.
      - name: Install a pinned version without dependencies
        run: |
          curl -fsSL "file://$PWD/install.sh" | sudo BETTY_SKIP_DEPS=true BETTY_VERSION=v1.7.4 sh
          betty --version | grep -q '1.7.4'

      - name: Refuse to install without cosign when a signature is required
        run: |
          if command -v cosign >/dev/null 2>&1; then echo "cosign is preinstalled; skipping"; exit 0; fi
          if curl -fsSL "file://$PWD/install.sh" | sudo BETTY_SKIP_DEPS=true BETTY_REQUIRE_SIGNATURE=true BETTY_VERSION=v1.7.5 sh; then
            echo "The installer should have refused to install without cosign."
            exit 1
          fi

      - uses: sigstore/cosign-installer@v3

      # cosign-installer puts cosign in a user directory, which sudo's PATH drops.
      - name: Install with a verified signature
        run: |
          curl -fsSL "file://$PWD/install.sh" | sudo env "PATH=$PATH" BETTY_SKIP_DEPS=true BETTY_REQUIRE_SIGNATURE=true BETTY_VERSION=v1.7.5 sh | tee install.log
          grep -q 'Signature verification passed' install.log
          betty --version | grep -q '1.7.5'

  # The arm64 binary is cross-built on x64; this runs it on arm64 Windows.
  install-ps1-arm64:
    name: install.ps1 (windows arm64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install a pinned version without dependencies
        shell: pwsh
        run: |
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-bin'
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
          $version = & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --version
          if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch '1\.7\.5') { throw "unexpected betty --version output: $version" }

  install-ps1:
    name: install.ps1 (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Run through `iex` like `irm … | iex`, where there is no script file (the
      # old elevation relaunch via $PSCommandPath broke exactly there). GitHub's
      # Windows runners are elevated, so this cannot prove the non-admin path.
      - name: Install a pinned version without dependencies
        shell: pwsh
        run: |
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_VERSION = 'v1.7.4'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-bin'
          $script = Get-Content -Raw ./install.ps1
          $runner = "Invoke-Expression ([System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('$([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($script)))')))"
          $p = Start-Process pwsh -ArgumentList '-NoProfile', '-Command', $runner -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "install.ps1 failed with exit code $($p.ExitCode)" }
          $version = & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --version
          if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch '1\.7\.4') { throw "unexpected betty --version output: $version" }

      - name: Refuse to install without cosign when a signature is required
        shell: pwsh
        run: |
          if (Get-Command cosign -ErrorAction SilentlyContinue) { Write-Host 'cosign is preinstalled; skipping'; exit 0 }
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_REQUIRE_SIGNATURE = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-refused'
          $p = Start-Process pwsh -ArgumentList '-NoProfile', '-File', './install.ps1' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -eq 0) { throw 'The installer should have refused to install without cosign.' }

      - uses: sigstore/cosign-installer@v3

      # Windows PowerShell 5.1, the shell `irm … | iex` usually runs in: it treats
      # stderr from cosign differently from pwsh. The step runs in 5.1 itself;
      # launched from pwsh, 5.1 would inherit pwsh's module path and miss cmdlets.
      - name: Install with a verified signature (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:BETTY_SKIP_DEPS = 'true'
          $env:BETTY_REQUIRE_SIGNATURE = 'true'
          $env:BETTY_VERSION = 'v1.7.5'
          $env:BETTY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'betty-signed'
          # The runner sets 'Stop'; the child's own output must not abort this step.
          $ErrorActionPreference = 'Continue'
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) { throw "install.ps1 failed with exit code $exitCode" }
          if ($output -notmatch 'Signature verification passed') { throw 'The signature was not verified.' }
          $version = & (Join-Path $env:BETTY_INSTALL_DIR 'betty.exe') --version
          if (($version -join ' ') -notmatch '1\.7\.5') { throw "unexpected betty --version output: $version" }
